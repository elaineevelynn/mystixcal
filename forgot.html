<!doctype html>
<html>

<head>
    <title>Forgot Password</title>
    <link rel="icon" href="img/logom 2.png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <link href="style/css_forgot.css" rel="stylesheet">
</head>

<body>
    <div class="container-fluid full-height">
        <div class="row" style="text-align: center">
            <a class="align-self-center mt-sm-5 mb-sm-3" href="index.html">
                <img src="img/logo 2.png" alt="" style="height: 5rem" />
            </a>
            <form action="check_email.html" method="post">
                <div class="container">
                    <h1 style="text-align: center">Forgot Password</h1>
                    <p style="text-align: center">
                        Please fill your email.
                    </p>
                    <hr />

                    <i class="fa-solid fa-envelope"></i><label for="email"
                        style="text-align: start"><b>Email</b></label>
                    <input type="text" placeholder="Enter Email" name="email" id="email" required />

                    <button type="submit" class="forgotbtn" style="background-image: url(img/button_background.png);">
                        Forgot Password
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
