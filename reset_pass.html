<!doctype html>
<html>

<head>
    <title>Forgot Password</title>
    <link rel="icon" href="img/logom 2.png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="style/css_reset_pass.css" />
</head>

<body>
    <div class="container-fluid full-height">
        <div class="row" style="text-align: center">
            <a class="align-self-center mt-sm-5 mb-sm-3" href="index.html">
                <img src="img/logo 2.png" alt="" style="height: 5rem" />
            </a>
            <form action="pass_changed.php" method="post">
                <div class="container">
                    <h1 style="text-align: center">New Password</h1>
                    <p style="text-align: center">
                        Please remember your password.
                    </p>
                    <hr />

                    <i class="fa-solid fa-lock"></i><label for="psw"><b>Password</b></label>
                    <input type="password" placeholder="New Password" name="psw" id="psw" required />

                    <i class="fa-solid fa-lock"></i><label for="newpsw"><b>Confirm Password</b></label>
                    <input type="password" placeholder="Repeat New Password" name="newpsw" id="newpsw" required />

                    <button type="submit" class="resetpass" style="background-image: url(img/button_background.png);">
                        Reset Password
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
