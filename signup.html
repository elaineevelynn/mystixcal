<!DOCTYPE html>
<html lang="en">

<head>
    <title>Account MYSTIXCAL</title>
    <meta charset="utf-8" />
    <link rel="icon" href="img/logom 2.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v2.1.9/css/unicons.css" />
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.5.0/css/bootstrap.min.css" />
    <link rel="stylesheet" href="style/css_signin_login.css" />
</head>

<body>
    <div class="section">
        <div class="container-fluid full-height">
            <div class="row justify-content-center">
                <a class="align-self-center mt-sm-5 mb-sm-3" href="index.html">
                    <img src="img/logo 2.png" alt="" style="height: 5rem" />
                </a>
                <div class="col-12 text-center align-self-center py-5">
                    <div class="section pb-5 pt-5 pt-sm-2 text-center">
                        <h6 class="mb-0 pb-3">
                            <span>Log In</span><span>Sign Up</span>
                        </h6>
                        <input class="checkbox" type="checkbox" id="reg-log" name="reg-log" checked />
                        <label for="reg-log"></label>
                        <div class="card-3d-wrap mx-auto">
                            <div class="card-3d-wrapper">
                                <div class="card-front">
                                    <div class="center-wrap">
                                        <div class="section text-center">
                                            <h4 class="mb-4 pb-3">Log In</h4>
                                            <form action="index.html" method="post">
                                                <div class="form-group">
                                                    <input type="email" class="form-style" placeholder="Email"
                                                        required />
                                                    <i class="input-icon uil uil-envelope-alt"></i>
                                                </div>

                                                <div class="form-group mt-2">
                                                    <input type="tel" class="form-style" placeholder="Phone Number"
                                                        required />
                                                    <i class="input-icon uil uil-phone-alt"></i>
                                                </div>

                                                <div class="form-group mt-2">
                                                    <input type="password" class="form-style" placeholder="Password"
                                                        required />
                                                    <i class="input-icon uil uil-lock-alt"></i>
                                                </div>
                                                <button class="btn mt-4" style="background-image: url(img/button_background.png);">Login</button>
                                            </form>
                                            <p class="mb-0 mt-4 text-center">
                                                <a href="forgot.html" class="link">Forgot your password?</a>
                                            </p>
                                        </div>
                                    </div>
                                </div>

                                <!--Card Back-->
                                <div class="card-back">
                                    <div class="center-wrap">
                                        <div class="section text-center">
                                            <h4 class="mb-3 pb-3">Sign Up</h4>
                                            <form action="login.html" method="post">
                                                <div class="form-group">
                                                    <input type="text" class="form-style" placeholder="First Name"
                                                        required />
                                                    <i class="input-icon uil uil-users-alt"></i>
                                                </div>

                                                <div class="form-group mt-2">
                                                    <input type="text" class="form-style" placeholder="Second Name"
                                                        required />
                                                    <i class="input-icon uil uil-users-alt"></i>
                                                </div>

                                                <div class="form-group mt-2">
                                                    <input type="email" class="form-style" placeholder="Email"
                                                        required />
                                                    <i class="input-icon uil uil-envelope-alt"></i>

                                                    <div class="form-group mt-2">
                                                        <input type="tel" class="form-style" placeholder="Phone Number"
                                                            required />
                                                        <i class="input-icon uil uil-phone-alt"></i>
                                                    </div>

                                                    <div class="form-group mt-2">
                                                        <input type="password" class="form-style" placeholder="Password"
                                                            required />
                                                        <i class="input-icon uil uil-lock-alt"></i>
                                                    </div>

                                                    <div class="form-group mt-2">
                                                        <input type="password" class="form-style"
                                                            placeholder="Repeat Password" required />
                                                        <i class="input-icon uil uil-lock-alt"></i>
                                                    </div>

                                                    <button class="btn mt-4" style="background-image: url(img/button_background.png);">Sign Up</button>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
